<app-item (textoAgregado)="agregar($event)"></app-item>

@for(item of tareas; track item.id){
<ul>
    <li>
        <span class="id-estilo">{{ item.id }}</span>
        <span class="espaciado nombre-estilo">{{ item.name }}</span>
        <button (click)="borrar(item.id)" class="espaciado">Quitar</button>
    </li>
</ul>
}
